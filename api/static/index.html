<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تشخيص أمراض النباتات</title>
<style>
  :root { --g:#2e7d32; --gl:#e8f5e9; --bd:#d7ddd8; --tx:#1b2a1f; --mt:#5b6b60; --rd:#c62828; --am:#b26a00; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background:#f4f7f4; color:var(--tx); }
  .wrap { max-width:560px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:24px; margin:8px 0 4px; }
  p.sub { color:var(--mt); margin:0 0 20px; }
  .card { background:#fff; border:1px solid var(--bd); border-radius:14px; padding:16px; }
  .drop { border:2px dashed var(--bd); border-radius:12px; padding:28px 12px; text-align:center; cursor:pointer; color:var(--mt); transition:.15s; }
  .drop.over { border-color:var(--g); background:var(--gl); }
  .drop img { max-width:100%; max-height:300px; border-radius:10px; display:block; margin:0 auto; }
  button { width:100%; margin-top:14px; padding:13px; border:0; border-radius:10px; background:var(--g); color:#fff; font-size:16px; cursor:pointer; }
  button:disabled { opacity:.5; cursor:not-allowed; }
  #result { margin-top:16px; display:none; }
  .main { display:flex; justify-content:space-between; align-items:flex-start; gap:12px; }
  .plant { color:var(--mt); font-size:14px; }
  .cond { font-size:22px; font-weight:700; margin-top:2px; direction:ltr; text-align:right; }
  .badge { padding:4px 10px; border-radius:99px; font-size:13px; white-space:nowrap; }
  .ok { background:var(--gl); color:var(--g); } .bad { background:#fdecea; color:var(--rd); }
  .warn { margin-top:12px; padding:10px 12px; border-radius:10px; background:#fff4e0; color:var(--am); font-size:14px; display:none; }
  .row { margin-top:12px; font-size:14px; }
  .row .top { display:flex; justify-content:space-between; gap:8px; direction:ltr; }
  .bar { height:8px; background:#e9eeea; border-radius:99px; margin-top:5px; overflow:hidden; direction:ltr; }
  .bar > i { display:block; height:100%; background:var(--g); }
  .err { margin-top:12px; color:var(--rd); display:none; }
  footer { margin-top:20px; font-size:12px; color:var(--mt); text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🌿 تشخيص أمراض النباتات</h1>
  <p class="sub">ارفع صورة واضحة لورقة نبات لتعرف نوع النبات وحالته.</p>

  <div class="card">
    <label class="drop" id="drop">
      <input type="file" id="file" accept="image/*" hidden>
      <span id="hint">اضغط لاختيار صورة أو اسحبها هنا</span>
      <img id="preview" alt="" hidden>
    </label>
    <button id="go" disabled>شخّص الصورة</button>
    <div class="err" id="err"></div>

    <div id="result">
      <div class="main">
        <div>
          <div class="plant" id="plant"></div>
          <div class="cond" id="cond"></div>
        </div>
        <span class="badge" id="badge"></span>
      </div>
      <div class="warn" id="warn">الثقة منخفضة. جرّب صورة أوضح للورقة وحدها على خلفية بسيطة.</div>
      <div id="top3"></div>
    </div>
  </div>

  <footer>النتيجة استرشادية وليست بديلاً عن رأي مهندس زراعي. النموذج مدرَّب على صور PlantVillage، وقد تقل دقته على صور الحقول الحقيقية.</footer>
</div>

<script>
const $ = id => document.getElementById(id);
const file = $("file"), drop = $("drop"), go = $("go");
let current = null;

function setFile(f) {
  if (!f || !f.type.startsWith("image/")) return;
  current = f;
  $("preview").src = URL.createObjectURL(f);
  $("preview").hidden = false;
  $("hint").hidden = true;
  go.disabled = false;
  $("result").style.display = "none";
  $("err").style.display = "none";
}

file.addEventListener("change", () => setFile(file.files[0]));
["dragenter","dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave","drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => setFile(ev.dataTransfer.files[0]));

go.addEventListener("click", async () => {
  if (!current) return;
  go.disabled = true; go.textContent = "جاري التشخيص...";
  $("err").style.display = "none";
  try {
    const fd = new FormData(); fd.append("file", current);
    const r = await fetch("/predict", { method: "POST", body: fd });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || "حدث خطأ");
    show(data);
  } catch (e) {
    $("err").textContent = e.message; $("err").style.display = "block";
  } finally {
    go.disabled = false; go.textContent = "شخّص الصورة";
  }
});

function show(d) {
  const p = d.prediction;
  $("plant").textContent = p.plant;
  $("cond").textContent = p.condition;
  const b = $("badge");
  b.textContent = p.healthy ? "سليمة" : "مصابة";
  b.className = "badge " + (p.healthy ? "ok" : "bad");
  $("warn").style.display = d.low_confidence ? "block" : "none";
  $("top3").innerHTML = d.top3.map(t => `
    <div class="row">
      <div class="top"><span>${t.plant} — ${t.condition}</span><b>${(t.confidence*100).toFixed(1)}%</b></div>
      <div class="bar"><i style="width:${(t.confidence*100).toFixed(1)}%"></i></div>
    </div>`).join("");
  $("result").style.display = "block";
}
</script>
</body>
</html>
